<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>⚡ Cyber Tic-Tac-Toe</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Orbitron', monospace;
      background: #07070f;
      background-image:
        linear-gradient(rgba(0,255,255,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,255,255,0.04) 1px, transparent 1px);
      background-size: 44px 44px;
      color: #c8f0f8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    body::before {
      content: '';
      position: fixed; inset: 0;
      background: repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(0,0,0,0.08) 3px, rgba(0,0,0,0.08) 4px);
      pointer-events: none;
      z-index: 9000;
    }

    .container { width: 100%; max-width: 580px; text-align: center; padding: 20px; }

    h1 {
      margin: 10px 0 24px;
      font-size: 1.8rem; font-weight: 900;
      letter-spacing: 5px; text-transform: uppercase;
      color: #00ffff;
      text-shadow: 0 0 8px #00ffff, 0 0 22px #00ffff, 0 0 44px rgba(0,255,255,0.5);
      animation: hFlicker 7s infinite;
    }
    @keyframes hFlicker {
      0%,96%,100% { opacity:1; }
      97% { opacity:0.6; }
      97.5% { opacity:1; }
      98.5% { opacity:0.4; }
      99% { opacity:1; }
    }

    /* SCOREBOARD */
    .scoreboard { display: flex; justify-content: center; gap: 20px; margin: 12px 0; font-size: 0.78rem; font-weight: 700; letter-spacing: 2px; }
    .score { padding: 7px 18px; border: 1px solid rgba(0,255,255,0.22); border-radius: 3px; background: rgba(0,255,255,0.04); box-shadow: 0 0 6px rgba(0,255,255,0.12); text-transform: uppercase; }

    /* SETUP */
    #setup-screen input[type="text"] {
      width: 100%; padding: 12px 16px; margin: 8px 0;
      border: 1px solid rgba(0,255,255,0.28); border-radius: 3px;
      font-size: 0.9rem; font-family: 'Orbitron', monospace;
      background: rgba(0,255,255,0.04); color: #00ffff;
      letter-spacing: 2px; outline: none; transition: all 0.3s;
    }
    #setup-screen input[type="text"]:focus { border-color: #00ffff; box-shadow: 0 0 14px rgba(0,255,255,0.35), inset 0 0 10px rgba(0,255,255,0.06); }
    #setup-screen input[type="text"]::placeholder { color: rgba(0,255,255,0.28); }

    .mode-group { display: flex; gap: 10px; justify-content: center; margin: 12px 0; }
    .mode-opt {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 18px; border: 1px solid rgba(0,255,255,0.22); border-radius: 3px;
      cursor: pointer; font-size: 0.78rem; letter-spacing: 2px; text-transform: uppercase;
      transition: all 0.2s; color: rgba(0,255,255,0.5); user-select: none;
    }
    .mode-opt input[type="radio"] { display: none; }
    .mode-opt:has(input:checked) { border-color: #00ffff; background: rgba(0,255,255,0.1); box-shadow: 0 0 10px rgba(0,255,255,0.25); color: #00ffff; }

    #start-btn {
      margin-top: 16px; padding: 12px 44px;
      background: transparent; color: #00ffff;
      border: 2px solid #00ffff; border-radius: 3px;
      font-size: 0.9rem; font-family: 'Orbitron', monospace;
      font-weight: 700; letter-spacing: 4px; text-transform: uppercase;
      cursor: pointer; transition: all 0.3s;
      box-shadow: 0 0 12px rgba(0,255,255,0.28), inset 0 0 10px rgba(0,255,255,0.05);
    }
    #start-btn:hover { background: rgba(0,255,255,0.1); box-shadow: 0 0 24px rgba(0,255,255,0.6), 0 0 50px rgba(0,255,255,0.3); transform: scale(1.04); }

    /* GAME SCREEN */
    #game-screen { display: none; }
    .round-info { font-size: 0.82rem; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; color: rgba(0,255,255,0.55); margin: 10px 0; }
    .current-turn { margin: 10px 0; padding: 7px 16px; border-radius: 3px; background: rgba(0,255,255,0.04); border: 1px solid rgba(0,255,255,0.18); display: inline-block; font-size: 0.78rem; letter-spacing: 2px; text-transform: uppercase; }
    .message { margin: 12px 0; padding: 10px; border-radius: 3px; background: rgba(0,255,255,0.04); min-height: 22px; font-size: 0.82rem; letter-spacing: 1px; }

    /* BOARD */
    #board-3d { margin: 14px auto; }
    .layers-container { display: flex; gap: 10px; justify-content: center; }
    .layer-section { flex: 1; max-width: 168px; }
.layer-board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }

    /* depth cues */
    #layer-1 .cell { opacity: 0.82; }
    #layer-2 .cell { opacity: 0.64; }

    /* CELLS */
    .cell {
      aspect-ratio: 1;
      background: rgba(0,255,255,0.03);
      border: 1px solid rgba(0,255,255,0.18);
      border-radius: 5px;
      font-size: 2.2rem; font-weight: 900; font-family: 'Orbitron', monospace;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.18s, box-shadow 0.18s, border-color 0.18s, background 0.18s;
      position: relative;
      animation: floatCell 2.6s ease-in-out infinite;
      box-shadow: 0 8px 20px rgba(0,0,0,0.75), 0 2px 6px rgba(0,0,0,0.5), inset 0 0 8px rgba(0,255,255,0.04);
    }
    .cell::after {
      content: '';
      position: absolute; bottom: -10px; left: 15%;
      width: 70%; height: 8px;
      background: rgba(0,0,0,0.55); border-radius: 50%; filter: blur(5px);
      animation: blobShadow 2.6s ease-in-out infinite;
    }
    @keyframes floatCell { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    @keyframes blobShadow { 0%,100% { opacity:0.55; transform:scaleX(1); } 50% { opacity:0.18; transform:scaleX(0.62); } }

    .cell:hover:not(.taken) {
      border-color: rgba(0,255,255,0.65); background: rgba(0,255,255,0.07);
      box-shadow: 0 0 16px rgba(0,255,255,0.35), 0 16px 32px rgba(0,0,0,0.85), inset 0 0 14px rgba(0,255,255,0.08);
      transform: translateY(-10px) scale(1.06); animation: none;
    }
    .cell:hover:not(.taken)::after { opacity: 0.1; transform: scaleX(0.5); }
    .cell.taken { cursor: not-allowed; animation: none; }
    .cell.taken::after { animation: none; opacity: 0.18; transform: scaleX(0.68); }

    .cell.x-piece {
      color: var(--nx, #ff2d78); border-color: var(--nx, #ff2d78); background: rgba(255,45,120,0.06);
      text-shadow: 0 0 10px var(--nx, #ff2d78), 0 0 22px var(--nx, #ff2d78);
      box-shadow: 0 0 16px var(--nx, #ff2d78), 0 8px 22px rgba(0,0,0,0.75), inset 0 0 12px rgba(255,45,120,0.1);
      transform: translateY(-4px);
    }
    .cell.x-piece::after { background: var(--nx, #ff2d78); opacity: 0.22; filter: blur(8px); }

    .cell.o-piece {
      color: var(--no, #00eeff); border-color: var(--no, #00eeff); background: rgba(0,238,255,0.06);
      text-shadow: 0 0 10px var(--no, #00eeff), 0 0 22px var(--no, #00eeff);
      box-shadow: 0 0 16px var(--no, #00eeff), 0 8px 22px rgba(0,0,0,0.75), inset 0 0 12px rgba(0,238,255,0.1);
      transform: translateY(-4px);
    }
    .cell.o-piece::after { background: var(--no, #00eeff); opacity: 0.22; filter: blur(8px); }

    /* smaller cells for 3D board */
    #board-3d .cell { font-size: 1.25rem; border-radius: 4px; }
    #board-3d .cell::after { bottom: -8px; }

    /* ROUND THEMES */
    body.theme-1 { --nx: #ff2d78; --no: #44aaff; }
    body.theme-1 h1 { color: #ff2d78; text-shadow: 0 0 8px #ff2d78, 0 0 22px #ff2d78, 0 0 44px rgba(255,45,120,0.45); }
    body.theme-1 .score, body.theme-1 .current-turn { border-color: rgba(255,45,120,0.28); }
    body.theme-1 #start-btn { color: #ff2d78; border-color: #ff2d78; box-shadow: 0 0 12px rgba(255,45,120,0.3); }
    body.theme-1 #start-btn:hover { box-shadow: 0 0 24px rgba(255,45,120,0.65), 0 0 50px rgba(255,45,120,0.3); }
    body.theme-1 .mode-opt:has(input:checked) { border-color: #ff2d78; box-shadow: 0 0 10px rgba(255,45,120,0.25); color: #ff2d78; }

    body.theme-2 { --nx: #ff9f43; --no: #a55eea; }
    body.theme-2 h1 { color: #ff9f43; text-shadow: 0 0 8px #ff9f43, 0 0 22px #ff9f43, 0 0 44px rgba(255,159,67,0.45); }
    body.theme-2 .score, body.theme-2 .current-turn { border-color: rgba(255,159,67,0.28); }

    body.theme-3 { --nx: #ff4444; --no: #e8e8e8; }
    body.theme-3 h1 { color: #ff4444; text-shadow: 0 0 8px #ff4444, 0 0 22px #ff4444, 0 0 44px rgba(255,68,68,0.45); }
    body.theme-3 .score, body.theme-3 .current-turn { border-color: rgba(255,68,68,0.28); }

    /* WARP OVERLAY */
    #warp-overlay {
      display: none; position: fixed; inset: 0;
      background: #000;
      justify-content: center; align-items: center; flex-direction: column;
      z-index: 800;
    }
    .warp-ring {
      position: absolute; top: 50%; left: 50%;
      border-radius: 50%; border: 2px solid #00ffff;
      box-shadow: 0 0 20px #00ffff, inset 0 0 20px rgba(0,255,255,0.3);
      transform: translate(-50%, -50%) scale(0);
      animation: warpRing 0.85s ease-out forwards;
    }
    .warp-ring:nth-child(1) { width: 120px; height: 120px; }
    .warp-ring:nth-child(2) { width: 70px; height: 70px; border-color: #ff2d78; box-shadow: 0 0 20px #ff2d78; animation-delay: 0.1s; }
    .warp-ring:nth-child(3) { width: 30px; height: 30px; border-color: rgba(0,255,255,0.6); animation-delay: 0.2s; }
    @keyframes warpRing {
      from { transform: translate(-50%,-50%) scale(0); opacity: 1; }
      to   { transform: translate(-50%,-50%) scale(22); opacity: 0; }
    }
    .warp-text {
      font-family: 'Orbitron', monospace;
      font-size: 0.9rem; letter-spacing: 7px; text-transform: uppercase;
      color: #00ffff; text-shadow: 0 0 20px #00ffff, 0 0 40px #00ffff;
      z-index: 1; animation: warpText 0.95s ease forwards;
    }
    @keyframes warpText {
      0%   { opacity: 0; transform: scale(2.2); filter: blur(12px); }
      35%  { opacity: 1; transform: scale(1);   filter: blur(0); }
      75%  { opacity: 1; }
      100% { opacity: 0; }
    }
    @keyframes gameWarpIn {
      0%   { opacity: 0; filter: blur(16px) brightness(3); transform: perspective(1200px) translateZ(-500px); }
      100% { opacity: 1; filter: blur(0)    brightness(1); transform: perspective(1200px) translateZ(0); }
    }
    #game-screen.warp-in { animation: gameWarpIn 0.75s cubic-bezier(0.19, 1, 0.22, 1) forwards; }

    /* WINNER OVERLAY */
    #winner-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.92);
      justify-content: center; align-items: center; flex-direction: column;
      z-index: 1000; backdrop-filter: blur(6px);
    }
    .loader{max-width:fit-content;color:rgb(242,255,240);font-size:50px;font-family:Mine;position:relative;font-style:italic;font-weight:600}.loader span{animation:cut 2s infinite;transition:1s cubic-bezier(0.175,0.885,0.32,1.275)}.loader:hover{color:#fcffdf}.loader::after{position:absolute;content:"";width:100%;height:6px;border-radius:4px;background-color:#ff828291;top:0;filter:blur(10px);animation:scan 2s infinite;left:0;z-index:0;transition:1s cubic-bezier(0.175,0.885,0.32,1.275)}.loader::before{position:absolute;content:"";width:100%;height:5px;border-radius:4px;background-color:#ff8282;top:0;animation:scan 2s infinite;left:0;z-index:1;filter:opacity(0.9);transition:1s cubic-bezier(0.175,0.885,0.32,1.275)}@keyframes scan{0%{top:0}25%{top:54px}50%{top:0}75%{top:54px}}@keyframes cut{0%{clip-path:inset(0 0 0 0)}25%{clip-path:inset(100% 0 0 0)}50%{clip-path:inset(0 0 100% 0)}75%{clip-path:inset(0 0 0 0)}}

    #replay-prompt { margin-top: 30px; display: none; text-align: center; }
    #replay-btn {
      padding: 12px 32px; background: transparent; color: #00ffff;
      border: 2px solid #00ffff; border-radius: 3px;
      font-size: 0.9rem; font-family: 'Orbitron', monospace;
      font-weight: 700; letter-spacing: 3px; text-transform: uppercase;
      cursor: pointer; box-shadow: 0 0 10px rgba(0,255,255,0.35); margin-top: 15px;
      transition: all 0.3s; display: block; margin-left: auto; margin-right: auto;
    }
    #replay-btn:hover { background: rgba(0,255,255,0.1); box-shadow: 0 0 22px #00ffff, 0 0 44px rgba(0,255,255,0.4); }

    .hidden { display: none !important; }
  </style>
</head>
<body class="theme-1">

  <div id="warp-overlay">
    <div class="warp-ring"></div>
    <div class="warp-ring"></div>
    <div class="warp-ring"></div>
    <span class="warp-text">Entering Arena</span>
  </div>

  <div class="container">
    <h1>⚡ Cyber Tac</h1>

    <div id="setup-screen">
      <input type="text" id="player1" placeholder="Your Name  ( X )" maxlength="12" />
      <input type="text" id="player2" placeholder="Player 2 Name  ( O )" maxlength="12" />

      <div class="mode-group">
        <label class="mode-opt"><input type="radio" name="mode" value="pvp" checked /><span>2 Players</span></label>
        <label class="mode-opt"><input type="radio" name="mode" value="ai" /><span>vs AI</span></label>
      </div>

      <div id="difficulty-group" class="mode-group hidden">
        <label class="mode-opt"><input type="radio" name="difficulty" value="easy" checked /><span>Easy</span></label>
        <label class="mode-opt"><input type="radio" name="difficulty" value="hard" /><span>Hard</span></label>
      </div>

      <button id="start-btn">Initialize</button>
    </div>

    <div id="game-screen">
      <div class="scoreboard">
        <div class="score" id="score-p1">P1: 0</div>
        <div class="score" id="score-p2">P2: 0</div>
      </div>
      <div class="round-info" id="round-info">Round 1 of 5</div>
      <div class="current-turn" id="turn-indicator"></div>
      <div class="message" id="message"></div>

      <div id="board-3d">
        <div class="layers-container">
          <div class="layer-section">
            <div id="layer-0" class="layer-board"></div>
          </div>
          <div class="layer-section">
            <div id="layer-1" class="layer-board"></div>
          </div>
          <div class="layer-section">
            <div id="layer-2" class="layer-board"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="winner-overlay">
    <div class="loader"><span id="winner-name">PLAYER</span></div>
    <div id="replay-prompt">
      <p style="margin-top:20px;font-size:0.85rem;letter-spacing:3px;color:#666;font-family:'Orbitron',monospace;">MATCH COMPLETE</p>
      <button id="replay-btn">New Match</button>
    </div>
  </div>

  <script>
    const state = {
      players: { X: '', O: '' },
      scores:  { X: 0, O: 0 },
      round: 1, current: 'X',
      board3D: Array(3).fill(null).map(() => Array(3).fill(null).map(() => Array(3).fill(null))),
      gameOver: false,
      vsAI: false, aiDifficulty: 'easy'
    };

    const els = {
      setup:        document.getElementById('setup-screen'),
      game:         document.getElementById('game-screen'),
      board3D:      document.getElementById('board-3d'),
      layers:       [0,1,2].map(i => document.getElementById('layer-' + i)),
      warpOverlay:  document.getElementById('warp-overlay'),
      roundInfo:    document.getElementById('round-info'),
      turn:         document.getElementById('turn-indicator'),
      message:      document.getElementById('message'),
      scoreP1:      document.getElementById('score-p1'),
      scoreP2:      document.getElementById('score-p2'),
      winnerOverlay:document.getElementById('winner-overlay'),
      winnerName:   document.getElementById('winner-name'),
      replayPrompt: document.getElementById('replay-prompt'),
      replayBtn:    document.getElementById('replay-btn'),
      p2input:      document.getElementById('player2'),
      diffGroup:    document.getElementById('difficulty-group'),
      body:         document.body
    };

    document.querySelectorAll('input[name="mode"]').forEach(r => {
      r.addEventListener('change', () => {
        const isAI = document.querySelector('input[name="mode"]:checked').value === 'ai';
        els.p2input.style.display = isAI ? 'none' : 'block';
        els.diffGroup.classList.toggle('hidden', !isAI);
      });
    });

    document.getElementById('start-btn').addEventListener('click', startMatch);
    els.replayBtn.addEventListener('click', resetMatch);

    function flashError(id) {
      const el = document.getElementById(id);
      el.style.borderColor = '#ff4444';
      el.style.boxShadow = '0 0 14px rgba(255,68,68,0.6)';
      el.focus();
      setTimeout(() => { el.style.borderColor = ''; el.style.boxShadow = ''; }, 1500);
    }

    function startMatch() {
      const isAI = document.querySelector('input[name="mode"]:checked').value === 'ai';
      const p1   = document.getElementById('player1').value.trim();
      const p2   = els.p2input.value.trim();
      if (!p1)           { flashError('player1'); return; }
      if (!isAI && !p2)  { flashError('player2'); return; }
      state.vsAI = isAI;
      state.aiDifficulty = isAI
        ? document.querySelector('input[name="difficulty"]:checked').value
        : 'easy';
      state.players.X = p1;
      state.players.O = isAI ? 'AI' : p2;
      state.scores = { X: 0, O: 0 };
      state.round  = 1;
      els.setup.style.display = 'none';
      els.warpOverlay.style.display = 'flex';
      setTimeout(() => {
        els.warpOverlay.style.display = 'none';
        els.game.style.display = 'block';
        els.game.classList.add('warp-in');
        setTimeout(() => els.game.classList.remove('warp-in'), 800);
        startRound();
      }, 950);
    }

    function applyTheme() {
      els.body.className = '';
      if      (state.round === 1) els.body.classList.add('theme-1');
      else if (state.round === 2) els.body.classList.add('theme-2');
      else                        els.body.classList.add('theme-3');
    }

    function startRound() {
      state.board3D = Array(3).fill(null).map(() => Array(3).fill(null).map(() => Array(3).fill(null)));
      state.current = 'X';
      state.gameOver = false;
      els.message.textContent = '';
      els.roundInfo.textContent = 'Round ' + state.round + ' of 5';
      applyTheme();
      renderBoard();
      setTurn();
    }

    function setTurn() {
      if (state.vsAI && state.current === 'O') {
        els.turn.textContent = 'AI  thinking...';
      } else {
        els.turn.textContent = state.players[state.current] + '  ( ' + state.current + ' )';
      }
    }

    function makeCell(value, onclick, idx) {
      const cell = document.createElement('div');
      const pc   = value === 'X' ? ' x-piece' : value === 'O' ? ' o-piece' : '';
      cell.className = 'cell' + (value ? ' taken' + pc : '');
      cell.textContent = value || '';
      cell.style.animationDelay = (idx * 0.1) + 's';
      cell.onclick = onclick;
      return cell;
    }

    function renderBoard() {
      for (let l = 0; l < 3; l++) {
        els.layers[l].innerHTML = '';
        for (let r = 0; r < 3; r++)
          for (let c = 0; c < 3; c++)
            els.layers[l].appendChild(makeCell(state.board3D[l][r][c], () => handleMove(l, r, c), r * 3 + c));
      }
    }

    function handleMove(l, r, c) {
      if (state.gameOver || state.board3D[l][r][c]) return;
      if (state.vsAI && state.current === 'O') return;
      state.board3D[l][r][c] = state.current;
      finishMove();
    }

    function finishMove() {
      renderBoard();
      if (checkWin()) {
        state.scores[state.current]++;
        updateScoreboard();
        state.gameOver = true;
        if (state.scores[state.current] >= 3) {
          showWinner(state.current);
        } else {
          els.message.textContent = '⚡ ' + state.players[state.current] + ' wins round ' + state.round + '!';
          setTimeout(nextRound, 1800);
        }
      } else if (checkDraw()) {
        state.gameOver = true;
        els.message.textContent = '— Draw —  next round';
        setTimeout(nextRound, 1500);
      } else {
        state.current = state.current === 'X' ? 'O' : 'X';
        setTurn();
        if (state.vsAI && state.current === 'O' && !state.gameOver)
          setTimeout(aiMove, 480 + Math.random() * 280);
      }
    }

    function checkWin() { return checkWin3DFor(state.current); }

    function checkWin3DFor(p) {
      const b = state.board3D;
      for (let l = 0; l < 3; l++) {
        for (let i = 0; i < 3; i++) {
          if ([0,1,2].every(j => b[l][i][j] === p)) return true;
          if ([0,1,2].every(j => b[l][j][i] === p)) return true;
        }
        if ([0,1,2].every(i => b[l][i][i]   === p)) return true;
        if ([0,1,2].every(i => b[l][i][2-i] === p)) return true;
      }
      for (let r = 0; r < 3; r++)
        for (let c = 0; c < 3; c++)
          if ([0,1,2].every(l => b[l][r][c] === p)) return true;
      for (let r = 0; r < 3; r++) {
        if ([0,1,2].every(i => b[i][r][i]   === p)) return true;
        if ([0,1,2].every(i => b[i][r][2-i] === p)) return true;
      }
      for (let c = 0; c < 3; c++) {
        if ([0,1,2].every(i => b[i][i][c]   === p)) return true;
        if ([0,1,2].every(i => b[i][2-i][c] === p)) return true;
      }
      if ([0,1,2].every(i => b[i][i][i]   === p)) return true;
      if ([0,1,2].every(i => b[i][i][2-i] === p)) return true;
      if ([0,1,2].every(i => b[i][2-i][i] === p)) return true;
      if ([0,1,2].every(i => b[2-i][i][i] === p)) return true;
      return false;
    }

    function checkDraw() { return state.board3D.flat(2).every(c => c); }

    function updateScoreboard() {
      els.scoreP1.textContent = state.players.X + ': ' + state.scores.X;
      els.scoreP2.textContent = state.players.O + ': ' + state.scores.O;
    }

    function nextRound() {
      if (state.round < 5) { state.round++; startRound(); }
      else                   showWinner(null);
    }

    function showWinner(player) {
      state.gameOver = true;
      els.winnerOverlay.style.display = 'flex';
      els.winnerName.textContent = player ? state.players[player].toUpperCase() : 'NO ONE';
      els.replayPrompt.style.display = 'none';
      setTimeout(() => { els.replayPrompt.style.display = 'block'; }, 5000);
    }

    function resetMatch() {
      els.winnerOverlay.style.display = 'none';
      els.game.style.display  = 'none';
      els.setup.style.display = 'block';
      document.getElementById('player1').value = '';
      els.p2input.value = '';
      els.body.className = 'theme-1';
    }

    // ===== AI =====
    function aiMove() {
      if (state.gameOver || state.current !== 'O') return;
      const move = state.aiDifficulty === 'hard' ? getBestMove3D() : randomMove3D();
      if (!move) return;
      state.board3D[move[0]][move[1]][move[2]] = 'O';
      finishMove();
    }

    function randomMove3D() {
      const e = [];
      for (let l=0;l<3;l++) for (let r=0;r<3;r++) for (let c=0;c<3;c++)
        if (!state.board3D[l][r][c]) e.push([l,r,c]);
      return e.length ? e[Math.floor(Math.random() * e.length)] : null;
    }

    function getBestMove3D() {
      for (let l=0;l<3;l++) for (let r=0;r<3;r++) for (let c=0;c<3;c++) {
        if (!state.board3D[l][r][c]) {
          state.board3D[l][r][c] = 'O';
          if (checkWin3DFor('O')) { state.board3D[l][r][c] = null; return [l,r,c]; }
          state.board3D[l][r][c] = null;
        }
      }
      for (let l=0;l<3;l++) for (let r=0;r<3;r++) for (let c=0;c<3;c++) {
        if (!state.board3D[l][r][c]) {
          state.board3D[l][r][c] = 'X';
          if (checkWin3DFor('X')) { state.board3D[l][r][c] = null; return [l,r,c]; }
          state.board3D[l][r][c] = null;
        }
      }
      return randomMove3D();
    }
  </script>
